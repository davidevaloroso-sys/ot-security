apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: influxdb-pvc
  namespace: ot-namespace
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  namespace: ot-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      containers:
      - name: influxdb
        image: ghcr.io/davidevaloroso-sys/ot-security:influxdb-RELEASE_SHA
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8086
        env:
        # Retain the existing PVC paths and UID when replacing the runtime.
        # Initial credentials are supplied once through the setup API by bootstrap.
        - name: INFLUXD_BOLT_PATH
          value: /var/lib/influxdb2/influxd.bolt
        - name: INFLUXD_ENGINE_PATH
          value: /var/lib/influxdb2/engine
        - name: INFLUXD_SQLITE_PATH
          value: /var/lib/influxdb2/influxd.sqlite
        volumeMounts:
        - name: influxdb-storage
          mountPath: /var/lib/influxdb2
        - name: influxdb-config
          mountPath: /etc/influxdb2
        - name: tmp
          mountPath: /tmp
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        startupProbe:
          httpGet: &id001
            path: /health
            port: 8086
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet: *id001
          periodSeconds: 10
          timeoutSeconds: 3
      volumes:
      - name: influxdb-config
        persistentVolumeClaim:
          claimName: influxdb-config-pvc
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: influxdb-storage
        persistentVolumeClaim:
          claimName: influxdb-pvc
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: ot-namespace
spec:
  selector:
    app: influxdb
  ports:
  - name: http
    port: 8086
    targetPort: 8086
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: influxdb-config-pvc
  namespace: ot-namespace
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
