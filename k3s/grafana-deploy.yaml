apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: ot-namespace
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ot-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: ghcr.io/davidevaloroso-sys/ot-security:grafana-RELEASE_SHA
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: observability-secrets
              key: GRAFANA_ADMIN_USER
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: observability-secrets
              key: GRAFANA_ADMIN_PASSWORD
        - name: INFLUXDB_ORG
          valueFrom:
            secretKeyRef:
              name: observability-secrets
              key: INFLUXDB_ORG
        - name: INFLUXDB_BUCKET
          valueFrom:
            secretKeyRef:
              name: observability-secrets
              key: INFLUXDB_BUCKET
        - name: INFLUXDB_READ_TOKEN
          valueFrom:
            secretKeyRef:
              name: grafana-influxdb
              key: INFLUXDB_READ_TOKEN
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'false'
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: 'false'
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: 'false'
        - name: GF_SECURITY_COOKIE_SAMESITE
          value: strict
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: tmp
          mountPath: /tmp
        - name: grafana-datasource
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
        - name: grafana-provider
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: grafana-dashboard
          mountPath: /etc/grafana/ot-dashboards
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        startupProbe:
          httpGet: &id001
            path: /api/health
            port: 3000
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet: *id001
          periodSeconds: 10
          timeoutSeconds: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 472
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-pvc
      - name: grafana-datasource
        configMap:
          name: grafana-datasource
      - name: grafana-provider
        configMap:
          name: grafana-provider
      - name: grafana-dashboard
        configMap:
          name: grafana-dashboard
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ot-namespace
spec:
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  type: ClusterIP
