version: 2
# Dependabot secrets are separate from GitHub Actions secrets.
registries:
  docker-hardened-images:
    type: docker-registry
    url: https://dhi.io
    username: ${{secrets.DOCKERHUB_USERNAME}}
    password: ${{secrets.DOCKERHUB_TOKEN}}
updates:
  - package-ecosystem: "docker"
    directory: "/platform/influxdb"
    registries:
      - docker-hardened-images
    schedule:
      interval: weekly
  - package-ecosystem: "docker"
    directory: "/platform/grafana"
    registries:
      - docker-hardened-images
    schedule:
      interval: weekly
  - package-ecosystem: "npm"
    directory: "/platform/nodered/runtime"
    schedule:
      interval: weekly
  - package-ecosystem: "npm"
    directory: "/platform/nodered"
    schedule:
      interval: weekly
  - package-ecosystem: "docker"
    directory: "/platform/nodered"
    schedule:
      interval: weekly
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: "pip"
    directory: "/IA-integration/ia-consumer"
    schedule:
      interval: weekly
  - package-ecosystem: "pip"
    directory: "/IA-integration/raspi-simulator"
    schedule:
      interval: weekly
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: "docker"
    directory: "/IA-integration/ia-consumer"
    schedule:
      interval: weekly
  - package-ecosystem: "docker"
    directory: "/IA-integration/raspi-simulator"
    schedule:
      interval: weekly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
