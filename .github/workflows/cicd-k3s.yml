name: CI-CD K3s OT
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  IMAGE_NAME: ghcr.io/davidevaloroso-sys/ot-security
  PYTHONPATH: ${{ github.workspace }}
  ANOMALY_THRESHOLD: '0.70'
jobs:
  test_train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: platform/nodered/package-lock.json
      - name: Validate Node-RED ingestion
        working-directory: platform/nodered
        run: |
          npm ci --ignore-scripts
          npm test
          npm audit --omit=dev --audit-level=high
      - run: bash scripts/validate_config.sh
      - run: bash scripts/run_tests.sh
      - run: bash scripts/run_sast.sh
      - name: Train with configured laboratory quality gates
        working-directory: IA-integration/ia-consumer
        env:
          MIN_ANOMALY_RECALL: ${{ vars.MIN_ANOMALY_RECALL }}
          MIN_ANOMALY_PRECISION: ${{ vars.MIN_ANOMALY_PRECISION }}
        run: |
          python train_model.py
          python -c "import mqtt_anomaly_consumer as app; app.load_model()"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-reports
          path: |
            bandit-reports/
            IA-integration/ia-consumer/training_metrics.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trained-model
          if-no-files-found: error
          path: |
            IA-integration/ia-consumer/model_random_forest.joblib
            IA-integration/ia-consumer/training_metrics.json
  build_scan:
    needs: test_train
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: consumer
            dockerfile: Dockerfile
            prefix: ''
          - name: simulator
            dockerfile: IA-integration/raspi-simulator/Dockerfile
            prefix: raspi-simulator-
          - name: inference
            dockerfile: IA-integration/ia-consumer/Dockerfile
            prefix: ia-consumer-
          - name: nodered
            dockerfile: platform/nodered/Dockerfile
            prefix: nodered-
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trained-model
          path: IA-integration/ia-consumer
      - name: Build locally without publishing
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          PREFIX: ${{ matrix.prefix }}
        run: docker build -f "$DOCKERFILE" -t "$IMAGE_NAME:$PREFIX$GITHUB_SHA" .
      - name: Check application image contents
        if: matrix.name != 'nodered'
        env:
          PREFIX: ${{ matrix.prefix }}
        run: >-
          docker run --rm --entrypoint python "$IMAGE_NAME:$PREFIX$GITHUB_SHA"
          -c 'from pathlib import Path; p=Path("/app"); assert not any(x.name == ".git" or x.name.startswith(".env") or x.suffix in (".pem", ".key") for x in p.rglob("*"))'
      - uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          version: v0.61.1
          image-ref: ${{ env.IMAGE_NAME }}:${{ matrix.prefix }}${{ github.sha }}
          scan-type: image
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
      - name: Save only scanned images for publication
        env:
          PREFIX: ${{ matrix.prefix }}
        run: docker save "$IMAGE_NAME:$PREFIX$GITHUB_SHA" -o image.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.name }}
          path: image.tar
          retention-days: 1
  integration:
    needs: build_scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install paho-mqtt==2.1.0 PyYAML==6.0.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*
          path: images
      - run: |
          for archive in images/*/image.tar; do docker load -i "$archive"; done
          python scripts/integration_test.py "$GITHUB_SHA"
  publish:
    needs: [build_scan, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*
          path: images
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          for archive in images/*/image.tar; do docker load -i "$archive"; done
          for prefix in '' raspi-simulator- ia-consumer- nodered-; do
            docker push "$IMAGE_NAME:$prefix$GITHUB_SHA"
          done
  deploy_k3s:
    needs: publish
    # Disabled until an operator explicitly enables the future lab collaudo.
    if: false
    runs-on: ubuntu-latest
    environment: lab
    concurrency:
      group: ot-lab-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install PyYAML==6.0.2
      - name: Reject stale revision before connecting
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$GITHUB_SHA"
      - name: Configure VPN and kubeconfig
        env:
          WG_PRIVATE: ${{ secrets.WG_CLIENT_PRIVATE_KEY }}
          WG_PUBLIC: ${{ secrets.WG_SERVER_PUBLIC_KEY }}
          WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
          KUBE_CONFIG: ${{ secrets.K3S_KUBECONFIG }}
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard
          umask 077
          printf '[Interface]\nAddress = 10.6.0.2/32\nPrivateKey = %s\n\n[Peer]\nPublicKey = %s\nEndpoint = %s\nAllowedIPs = 192.168.1.12/32,10.42.0.0/16,10.43.0.0/16\nPersistentKeepalive = 25\n' "$WG_PRIVATE" "$WG_PUBLIC" "$WG_ENDPOINT" > "$RUNNER_TEMP/wg0.conf"
          printf '%s\n' "$KUBE_CONFIG" > "$RUNNER_TEMP/kubeconfig"
          sudo wg-quick up "$RUNNER_TEMP/wg0.conf"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Validate API and deploy versioned workloads
        run: |
          kubectl version --client
          kubectl get --raw=/version
          python scripts/render_release.py "$GITHUB_SHA" --output rendered
          python scripts/preflight.py rendered
          kubectl apply --dry-run=server -f rendered
          kubectl apply -f rendered
          for workload in influxdb nodered grafana ot-mqtt-consumer raspi-simulator ia-consumer; do
            kubectl rollout status deployment/$workload -n ot-namespace --timeout=180s
          done
      - name: Remove VPN and temporary credentials
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/wg0.conf" ]; then sudo wg-quick down "$RUNNER_TEMP/wg0.conf" || true; fi
          rm -f "$RUNNER_TEMP/wg0.conf" "$RUNNER_TEMP/kubeconfig"
