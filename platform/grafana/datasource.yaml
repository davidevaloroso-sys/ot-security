apiVersion: 1
datasources:
  - name: OT InfluxDB
    uid: ot-influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: $INFLUXDB_ORG
      defaultBucket: $INFLUXDB_BUCKET
      tlsSkipVerify: false
      httpMode: POST
    secureJsonData:
      token: $INFLUXDB_READ_TOKEN
    version: 1
